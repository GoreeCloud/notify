name: Verify source

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notify-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/goreecloud-notify ./cmd/notifyd
  web:
    name: React web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

  linux:
    name: Qt Quick Linux build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: false
      - name: Configure Qt Quick
        run: cmake -S linux -B build/linux -DCMAKE_BUILD_TYPE=Release
      - name: Compile native Linux client
        run: cmake --build build/linux --parallel 2
