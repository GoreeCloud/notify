name: GoreeCloud Notify checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/notify
  browser-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cmd/notify/web/app.js
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goreecloud-notify:ci .
